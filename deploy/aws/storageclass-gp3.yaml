# Default StorageClass for EKS. New EKS clusters have no default StorageClass, so the
# vllm-model-cache PVC (deploy/k8s/vllm/pvc.yaml, no storageClassName) would stay Pending.
# reclaimPolicy Delete: deleting the PVC (scripts/aws_gpu.* down) also deletes the EBS
# volume, so nothing keeps billing after the cluster is gone.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer   # create the volume in the GPU node's zone
allowVolumeExpansion: true
