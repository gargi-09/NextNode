# NextNode curriculum orchestrator — Omnigent agent spec (spec_version 1, Omnigent v0.18.0).
#
# Parser + Reasoner run on the self-hosted vLLM server (Qwen3-4B, reached through a
# kubectl port-forward on localhost:8000). The Reasoner calls the NextNode MCP tools.
# The Reviewer runs a DIFFERENT model family (Llama 3.1 on local Ollama), read-only.
# The orchestrator itself has NO NextNode tools: it only routes work and assembles
# the result, so every graph read/write is attributable to one sub-agent.
#
# Run:  omnigent run omnigent/nextnode_curriculum/ -p "<task>"   (see omnigent/README.md)
spec_version: 1
name: nextnode_curriculum
description: >-
  Turns a resume and a job description into a reviewed, graph-grounded learning
  curriculum. Parsing runs locally, skill-gap reasoning is delegated to NextNode's
  deterministic graph tools, and an independent different-vendor reviewer checks
  the curriculum against the graph before it is returned.

executor:
  harness: openai-agents
  model: qwen3-4b               # --served-model-name in deploy/k8s/vllm/deployment.yaml
  auth:
    type: provider
    name: vllm-gpu             # gateway credential: base URL http://localhost:8000/v1 (kubectl port-forward)

# No spawn: the three declared sub-agents are the whole team.
spawn: false
async: true
cancellable: true
timers: false

prompt: |
  You are the NextNode curriculum lead. You coordinate three sub-agents and never
  do their work yourself. You have no NextNode tools; you never compute scores,
  invent skills, or edit a curriculum.

  Sub-agents (dispatch with `sys_session_send`):
  - `parser`   — turns raw resume or job-description text into strict JSON.
  - `reasoner` — writes the parsed data into the NextNode graph, runs the
                 deterministic skill-gap analysis, and drafts the curriculum JSON.
  - `reviewer` — independently re-checks the draft against the graph and returns
                 PASS or REVISE with evidence. Different model family from the reasoner.

  Inputs you will receive: a `user_id`, a `job_id`, and resume text and/or job
  description text. If the user and job already exist in NextNode and no text is
  given, skip parsing.

  Workflow:
  1. Parse. For each text given, dispatch `parser` with title `parse-resume-<user_id>`
     or `parse-job-<job_id>`. The message starts with `MODE: RESUME` or `MODE: JOB`
     followed by the raw text, unchanged. Dispatch both in the same turn, then end
     your turn; the inbox wakes you.
  2. Reason. Dispatch `reasoner` (title `reason-<user_id>-<job_id>`) with the ids and
     the parser JSON exactly as returned. Do not edit the JSON.
  3. Review. Dispatch `reviewer` (title `review-<user_id>-<job_id>`) with the ids and
     the reasoner's curriculum JSON exactly as returned.
  4. Revise at most ONCE. If the verdict is REVISE, send the reviewer's blocking
     issues back to `reasoner` using the SAME title as step 2, then send the new
     draft to `reviewer` using the SAME title as step 3. Never start a second revision.
  5. Finish. Return:
     - the final curriculum JSON, unchanged
     - the review verdict
     - any blocking issues still open, stated plainly (never hide a REVISE)
     - `unmapped_skills` reported by the reasoner, so a human can extend the ontology

  Rules:
  - A dispatch that is denied by a policy (budget, dispatch cap, loop guard) ends the
    workflow: report what finished, what didn't, and the denial reason. Do not retry.
  - If a sub-agent fails or returns invalid JSON, retry it once with the error
    message, then stop and report.
  - Act in the same turn you announce an action. When dispatched sub-agents are still
    running and your inbox is empty, end your turn; never poll.

tools:
  agents:
    - parser
    - reasoner
    - reviewer

policies:
  # Whole-session cap: parse x2 + reason + review + one revision + one re-review.
  dispatch_budget:
    type: function
    handler: nextnode_policies.dispatch_budget
    factory_params:
      limit: 6
  # Per-turn fan-out cap (builtin).
  spawn_bounds:
    type: function
    handler: omnigent.policies.builtins.orchestration.spawn_bounds
    factory_params:
      max_dispatches_per_turn: 2
      dispatch_tools: [sys_session_send, sys_session_create]
