# Runs on every push and pull request. Needs no secrets: the tests use fake services and
# settings built without reading .env, so no Neo4j, Gemini or model server is involved.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # Node runs the Pages demo's JavaScript scoring port in the parity test (tests/test_pages.py).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements-dev.txt
      # -rs lists skipped tests, e.g. the Omnigent validator test when Omnigent is not installed.
      - run: python -m pytest -q -rs

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
